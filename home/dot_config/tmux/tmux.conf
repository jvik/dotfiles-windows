# Options
set -sg terminal-overrides ",*:RGB"  # true color support
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window
set -g history-limit 1000000     # increase history size (from 2,000)


# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

# Change prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Theme: borders
set -g pane-border-lines heavy
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard (OSC 52 -> WezTerm -> Windows clipboard)
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
# setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Theme: status
set -g status-style bg=default,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

# Theme: status (windows)
# set -g window-status-format "●"
# set -g window-status-current-format "●"

set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"
set -g window-status-bell-style "fg=red,nobold"

bind k select-pane -U 
bind h select-pane -L 
bind j select-pane -D 
bind l select-pane -R 

bind -r W resize-pane -U
bind -r A resize-pane -L
bind -r S resize-pane -D
bind -r D resize-pane -R

# Keybindings: disable repeat for arrows
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Keybindings: split
#bind h split-window -h
bind | split-window -h
bind = split-window -h
#bind v split-window -v
bind - split-window -v

# Keybindings: windows
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Keybindings: other
bind f resize-pane -Z
bind q detach-client
bind e choose-window -Z

bind -n M-w select-pane -U
bind -n M-a select-pane -L
bind -n M-s select-pane -D
bind -n M-d select-pane -R
bind -n M-f resize-pane -Z

bind-key "t" run-shell "sesh connect \"$(
 	sesh list | fzf-tmux -p 55%,60% \
    --no-sort --reverse --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' 
)\""

##### Display Popups ##### 

bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-p display-popup -E "ipython"
bind C-r display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "ranger"
# chezmoi source repo inside WSL (ext4 clone, not /mnt/c)
bind C-z display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.local/share/chezmoi/'
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "fish"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-yank configuration (Windows has no primary selection)
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'  # Use clipboard for mouse selections

# Custom yank binding to copy command text (excluding prompts and timestamps).
# set-clipboard on already sends OSC 52 to WezTerm; also pipe to the Windows
# clipboard directly so it works in terminals without OSC 52. win32yank.exe
# (winget, via the WinGet Links dir on PATH) keeps UTF-8; clip.exe needs
# UTF-16LE or æøå get mangled. Single quotes: tmux expands $ in double quotes.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v win32yank.exe >/dev/null 2>&1; then win32yank.exe -i --crlf; else iconv -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe; fi'
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel 'if command -v win32yank.exe >/dev/null 2>&1; then win32yank.exe -i --crlf; else iconv -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe; fi'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
